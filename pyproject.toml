[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM for one person, running locally"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "backend.main:app"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
